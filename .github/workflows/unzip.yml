name: Extract Zip File Automatically

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ -f "Laprri AI.zip" ]; then
            unzip -o "Laprri AI.zip" -d .
            rm "Laprri AI.zip"
          elif [ -f "Laprri-Ai.zip" ]; then
            unzip -o "Laprri-Ai.zip" -d .
            rm "Laprri-Ai.zip"
          else
            echo "Zip file not found directly, searching for zip files..."
            find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d . \;
          fi

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-extracted zip files" && git push)
